<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ambient Music</title>
</head>

<body>
  <h2>🎵 Ambient Music Client</h2>
  <div id="player-container">
    <div id="player"></div>
  </div>

  <script>
    const queryParams = new URLSearchParams(window.location.search);
    const port = queryParams.get("port") || 3303;
    const socket = new WebSocket(`ws://localhost:${port}`);

    let player;
    let commandQueue = [];
    let requestedSyncVideoId;

    // ✅ Register as browser tab
    socket.addEventListener('open', () => {
      console.log('[Client] WebSocket connected');
      socket.send(JSON.stringify({ type: 'register', client: 'browser' }));
    });

    // ✅ Handle WebSocket messages
    socket.addEventListener('message', (event) => {
      const data = JSON.parse(event.data);
      if (!player || typeof player.playVideo !== 'function') {
        commandQueue.push(data);
        return;
      }
      handleCommand(data);
    });

    socket.addEventListener('close', () => {
      console.warn('[Client] WebSocket closed');
    });

    socket.addEventListener('error', (err) => {
      console.error('[Client] WebSocket error:', err);
    });

    // ✅ Inject YouTube API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
      const initialVideoId = extractVideoID("{{VIDEO_URL}}") || "5qap5aO4i9A"; // fallback lofi
      player = new YT.Player('player', {
        height: '315',
        width: '560',
        videoId: initialVideoId,
        playerVars: { autoplay: 1, mute: 0 },
        events: {
          onReady: () => {
            console.log('[Client] YouTube player ready');
            flushQueuedCommands();
            sendPlayerStatus();
          },
          onStateChange: sendPlayerStatus,
          onVolumeChange: sendPlayerStatus
        }
      });
      setInterval(sendPlayerStatus, 250);
    };

    function sendPlayerStatus() {
      if (!player?.getPlayerState) return;
      socket.send(JSON.stringify({
        type: 'playerStatus',
        state: player.getPlayerState(),
        videoId: player.getVideoData?.().video_id,
        currentTime: player.getCurrentTime?.() || 0,
        duration: player.getDuration?.() || 0,
        volume: player.getVolume?.() || 0,
        muted: player.isMuted?.() || false,
        timestamp: Date.now()
      }));
    }

    function flushQueuedCommands() {
      while (commandQueue.length > 0) {
        handleCommand(commandQueue.shift());
      }
    }

    function handleCommand({ command, url }) {
      if (command === 'syncStatus') {
        syncPlayerStatus(url);
        return;
      }

      const vid = extractVideoID(url);
      switch (command) {
        case 'play':
        case 'resume':
          player?.playVideo();
          break;
        case 'pause':
          player?.pauseVideo();
          break;
        case 'unmute':
          player?.unMute();
          break;
        case 'mute':
          player?.mute();
          break;
        case 'set_volume':
          if (typeof url === 'number') player?.setVolume(url);
          break;
        case 'seek':
          if (typeof url === 'number') {
            const duration = player?.getDuration?.() || 0;
            player?.seekTo(duration * url / 100, true);
          }
          break;
        case 'get_status':
          sendPlayerStatus();
          break;
        case 'switch':
          if (vid) {
            player.loadVideoById(vid);
            player.playVideo();
          }
          break;
        case 'close_tab':
          socket.send(JSON.stringify({ command: 'clientClosed' }));
          window.close();
          break;
      }
    }

    function syncPlayerStatus(status) {
      if (!status?.videoId) return;

      const elapsed = typeof status.timestamp === 'number'
        ? Math.max(0, Date.now() - status.timestamp) / 1000
        : 0;
      const expectedTime = status.currentTime + (status.state === 1 ? elapsed : 0);
      const currentVideoId = player.getVideoData?.()?.video_id;

      if (currentVideoId !== status.videoId) {
        if (requestedSyncVideoId !== status.videoId) {
          if (status.state === 1) {
            player.loadVideoById(status.videoId, expectedTime);
          } else {
            player.cueVideoById(status.videoId, expectedTime);
          }
          requestedSyncVideoId = status.videoId;
        }
      } else {
        requestedSyncVideoId = undefined;
        const currentTime = player.getCurrentTime?.() || 0;
        if (Math.abs(currentTime - expectedTime) > 0.75) {
          player.seekTo(expectedTime, true);
        }
        if (status.state === 1 && player.getPlayerState() !== 1) {
          player.playVideo();
        } else if (status.state !== 1 && player.getPlayerState() === 1) {
          player.pauseVideo();
        }
      }

      if (typeof status.volume === 'number' && player.getVolume() !== status.volume) {
        player.setVolume(status.volume);
      }
      if (status.muted && !player.isMuted()) {
        player.mute();
      } else if (!status.muted && player.isMuted()) {
        player.unMute();
      }
    }

    function extractVideoID(url) {
      if (typeof url !== 'string') return null;
      const match = url?.match(/(?:embed\/|v=|youtu\.be\/|v=)([\w-]{11})/);
      return match ? match[1] : null;
    }
  </script>
</body>
</html>
