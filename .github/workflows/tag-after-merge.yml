name: Tag and Release After Merge

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  create-tag-and-release:
    runs-on: ubuntu-latest
    env:
      version: ""
      last_tag: "0.0.0"
      release_type: "patch"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get new version from package.json
        run: |
          VERSION=$(jq -r '.version // empty' package.json)
          if [ -z "$VERSION" ]; then
            echo "Could not read version from package.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Get last tag (if exists)
        run: |
          LAST_TAG=$(git tag --merged HEAD --sort=-v:refname | head -n 1)
          LAST_TAG_STRIPPED=${LAST_TAG#v}
          echo "last_tag=${LAST_TAG_STRIPPED:-0.0.0}" >> "$GITHUB_ENV"

      - name: Check release type (skip patch)
        run: |
          NEW="$version"
          OLD="$last_tag"

          NEW_MAJOR=$(echo "$NEW" | cut -d. -f1)
          NEW_MINOR=$(echo "$NEW" | cut -d. -f2)
          OLD_MAJOR=$(echo "$OLD" | cut -d. -f1)
          OLD_MINOR=$(echo "$OLD" | cut -d. -f2)

          if [ "$NEW_MAJOR" -gt "$OLD_MAJOR" ]; then
            echo "release_type=major" >> "$GITHUB_ENV"
          elif [ "$NEW_MAJOR" -eq "$OLD_MAJOR" ] && [ "$NEW_MINOR" -gt "$OLD_MINOR" ]; then
            echo "release_type=minor" >> "$GITHUB_ENV"
          else
            echo "release_type=patch" >> "$GITHUB_ENV"
          fi

      - name: Skip if patch
        if: env.release_type == 'patch'
        run: echo "Patch release detected -> no tag or release will be created."

      - name: Create and push git tag
        if: env.release_type != 'patch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$version"
          git push origin "v$version"

      - name: Extract release notes from CHANGELOG
        if: env.release_type != 'patch'
        id: changelog
        run: |
          if [ "$release_type" = "major" ]; then
            echo "## 🚀 Major Release" > RELEASE_NOTES.md
          elif [ "$release_type" = "minor" ]; then
            echo "## ✨ Minor Release" > RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md

          awk "/^## v${version}([[:space:]]|\$)/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md >> RELEASE_NOTES.md

      - name: Create GitHub Release
        if: env.release_type != 'patch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.version }}"
          name: "v${{ env.version }}"
          body_path: RELEASE_NOTES.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}